name: Pokéradar

on:
  schedule:
    - cron: "*/20 * * * *"   # News, Vorverkäufe, Schnäppchen
    - cron: "40 8 * * *"     # Cardmarket-Preise (Datei wird morgens aktualisiert)
    - cron: "0 17 * * *"     # Abendübersicht (19 Uhr Sommerzeit, 18 Uhr Winterzeit)
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll laufen?"
        type: choice
        options: [alles, news, markt, abend, ki-test]
        default: alles

permissions:
  contents: write

env:
  LLAMA_VERSION: b11297
  MODELL_DATEI: Qwen3-4B-Instruct-2507-Q4_K_M.gguf
  MODELL_URL: https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf

concurrency:
  group: pokeradar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: modus
        run: |
          case "${{ github.event.schedule }}" in
            "40 8 * * *") echo "wert=markt" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * *") echo "wert=abend" >> "$GITHUB_OUTPUT" ;;
            "")           echo "wert=${{ inputs.modus || 'alles' }}" >> "$GITHUB_OUTPUT" ;;
            *)            echo "wert=news" >> "$GITHUB_OUTPUT" ;;
          esac

      # ── Lokale KI: Qwen3-4B über llama.cpp, direkt im Lauf (kein Konto, kein Schlüssel) ──
      - name: KI aus dem Zwischenspeicher
        if: steps.modus.outputs.wert != 'markt' && steps.modus.outputs.wert != 'abend'
        uses: actions/cache@v4
        with:
          path: ~/ki
          key: ki-${{ env.LLAMA_VERSION }}-${{ env.MODELL_DATEI }}

      - name: Lokale KI starten
        if: steps.modus.outputs.wert != 'markt' && steps.modus.outputs.wert != 'abend'
        run: |
          mkdir -p ~/ki && cd ~/ki
          if [ ! -f "$MODELL_DATEI" ]; then
            curl -sSLf --retry 3 -o "$MODELL_DATEI.part" "$MODELL_URL" && mv "$MODELL_DATEI.part" "$MODELL_DATEI"
          fi
          if [ ! -x "llama-$LLAMA_VERSION/llama-server" ]; then
            curl -sSLf --retry 3 -o llama.tgz \
              "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_VERSION/llama-$LLAMA_VERSION-bin-ubuntu-x64.tar.gz"
            tar -xzf llama.tgz && rm llama.tgz
          fi
          cd "llama-$LLAMA_VERSION"
          LD_LIBRARY_PATH=. nohup ./llama-server -m ~/ki/"$MODELL_DATEI" --host 127.0.0.1 --port 8080 \
            -c 8192 -np 1 -t "$(nproc)" --jinja --alias qwen3-4b-instruct > ~/ki/server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "LOKALE_KI=1" >> "$GITHUB_ENV"; echo "KI bereit nach ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::warning::Lokale KI nicht gestartet – Radar nutzt Regeln"; tail -20 ~/ki/server.log

      - name: Radar ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m radar ${{ steps.modus.outputs.wert }}

      - name: Daten speichern
        run: |
          git config user.name "pokeradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -q -m "Radar: ${{ steps.modus.outputs.wert }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
