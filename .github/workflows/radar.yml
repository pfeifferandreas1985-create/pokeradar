name: Pokéradar

on:
  schedule:
    - cron: "*/20 * * * *"   # News, Vorverkäufe, Schnäppchen
    - cron: "40 8 * * *"     # Cardmarket-Preise (Datei wird morgens aktualisiert)
    - cron: "0 17 * * *"     # Abendübersicht (19 Uhr Sommerzeit, 18 Uhr Winterzeit)
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll laufen?"
        type: choice
        options: [alles, news, markt, abend]
        default: alles

permissions:
  contents: write

concurrency:
  group: pokeradar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: modus
        run: |
          case "${{ github.event.schedule }}" in
            "40 8 * * *") echo "wert=markt" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * *") echo "wert=abend" >> "$GITHUB_OUTPUT" ;;
            "")           echo "wert=${{ inputs.modus || 'alles' }}" >> "$GITHUB_OUTPUT" ;;
            *)            echo "wert=news" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Radar ausführen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -m radar ${{ steps.modus.outputs.wert }}

      - name: Daten speichern
        run: |
          git config user.name "pokeradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -q -m "Radar: ${{ steps.modus.outputs.wert }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
